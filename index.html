<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Belajar Angka, Bentuk & Huruf - RA Miftahul Ulum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3b2a6b;
    --pink:#ff6fae; --pink-d:#d94a8a;
    --blue:#4da8ff; --blue-d:#2a7fd6;
    --green:#39d98a; --green-d:#1fae67;
    --orange:#ffa94d; --orange-d:#e8851f;
    --purple:#a66bff; --purple-d:#7b45d6;
    --yellow:#ffd93d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  input,select{user-select:text;-webkit-user-select:text}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
  body{
    background:
      radial-gradient(circle at 15% 20%,#ffe3f1 0,transparent 40%),
      radial-gradient(circle at 85% 15%,#d9f0ff 0,transparent 40%),
      radial-gradient(circle at 80% 85%,#fff4c2 0,transparent 40%),
      radial-gradient(circle at 10% 90%,#dcfbe8 0,transparent 40%),
      linear-gradient(180deg,#fdf6ff,#eef7ff);
  }

  /* dekorasi mengambang */
  #bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .float{position:absolute;opacity:.55;animation:drift linear infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.08))}
  @keyframes drift{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}

  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;z-index:1}
  .screen.active{display:flex;animation:fadein .4s}
  #home,#menu{justify-content:flex-start;overflow-y:auto}
  #home>.card,#menu>.wrap{margin:auto}
  @keyframes fadein{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

  /* kartu utama */
  .card{
    background:rgba(255,255,255,.88);backdrop-filter:blur(6px);
    border-radius:40px;padding:clamp(18px,4vw,32px) clamp(18px,5vw,44px);
    box-shadow:0 20px 50px rgba(120,80,200,.18),0 0 0 6px #fff,0 0 0 10px rgba(166,107,255,.18);
    max-width:min(94vw,640px);width:100%;
  }
  .bismillah{font-size:clamp(20px,4.5vw,30px);color:var(--purple-d);margin-bottom:2px}
  .logo{font-size:clamp(48px,12vw,84px);animation:bounce 2.2s ease-in-out infinite;display:inline-block;line-height:1.1}
  .ribbon{
    display:inline-block;background:linear-gradient(135deg,#a66bff,#ff6fae);color:#fff;
    padding:6px 22px;border-radius:999px;font-size:clamp(15px,3.8vw,22px);font-weight:600;
    box-shadow:0 4px 0 rgba(0,0,0,.12);margin:6px 0 10px;
  }
  h1{font-size:clamp(28px,7.5vw,52px);margin:0 0 12px;color:var(--purple-d);text-shadow:3px 3px 0 #fff}
  .teacher{font-size:clamp(20px,5vw,32px);font-weight:600;margin:2px 0}

  /* form */
  .form{display:grid;gap:10px;text-align:left;margin-bottom:6px}
  .form label{display:block;font-weight:600;font-size:clamp(15px,3.8vw,19px);margin:0 0 3px 6px;color:var(--purple-d)}
  .form input,.form select{
    width:100%;font:500 clamp(17px,4.4vw,21px) "Fredoka",sans-serif;color:var(--ink);
    padding:11px 16px;border-radius:18px;border:3px solid #d9c9ff;background:#fff;outline:none;
    box-shadow:0 4px 0 #d9c9ff;
  }
  .form input:focus,.form select:focus{border-color:var(--purple)}
  .form input.err{border-color:#ff5d8f;background:#fff1f6;box-shadow:0 4px 0 #ffb6cf}
  .row2{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
  .msg{min-height:22px;color:#e0336f;font-weight:600;font-size:clamp(14px,3.6vw,18px);text-align:center}

  /* tombol 3D */
  .btn{
    border:none;border-radius:999px;padding:14px 34px;font:600 clamp(20px,5vw,30px) "Fredoka",sans-serif;color:#fff;cursor:pointer;margin:8px;
    background:linear-gradient(180deg,var(--c1),var(--c2));
    box-shadow:0 8px 0 var(--c3),0 14px 18px rgba(0,0,0,.15),inset 0 3px 0 rgba(255,255,255,.4);
    text-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .08s,box-shadow .08s;
  }
  .btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--c3),0 4px 6px rgba(0,0,0,.15),inset 0 3px 0 rgba(255,255,255,.4)}
  .btn.green{--c1:#5cf0a8;--c2:var(--green);--c3:var(--green-d)}
  .btn.blue{--c1:#7cc1ff;--c2:var(--blue);--c3:var(--blue-d)}
  .btn.orange{--c1:#ffc67a;--c2:var(--orange);--c3:var(--orange-d)}
  .btn.pink{--c1:#ff9ac8;--c2:var(--pink);--c3:var(--pink-d)}
  .btn.purple{--c1:#c59aff;--c2:var(--purple);--c3:var(--purple-d)}
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:6px 4px;width:min(94vw,560px)}
  .menu .btn{margin:6px;padding:18px 10px;font-size:clamp(17px,4.4vw,26px);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
  .menu .btn small{font-size:.58em;font-weight:400;opacity:.95}
  .menu .big{font-size:1.9em;line-height:1.1}

  /* layar permainan */
  #top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:3;gap:6px}
  .round{width:52px;height:52px;flex:none;border-radius:50%;border:none;font-size:24px;cursor:pointer;background:#fff;
    box-shadow:0 5px 0 #d9c9ff,0 8px 14px rgba(0,0,0,.12)}
  .round:active{transform:translateY(4px);box-shadow:0 1px 0 #d9c9ff}
  .dots{display:flex;gap:5px;background:#fff;padding:9px 12px;border-radius:999px;box-shadow:0 4px 0 #d9c9ff}
  .dot{width:13px;height:13px;border-radius:50%;background:#ece4ff;transition:.3s}
  .dot.on{background:linear-gradient(135deg,#ffd93d,#ffa94d);transform:scale(1.15);box-shadow:0 0 8px #ffd93d}
  #stage{flex:1;width:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding-top:66px}
  .panel{
    background:rgba(255,255,255,.88);border-radius:44px;padding:clamp(12px,3vw,26px);
    box-shadow:0 18px 40px rgba(120,80,200,.2),0 0 0 6px #fff,0 0 0 10px var(--col-soft);
    display:flex;flex-direction:column;align-items:center;max-width:94vw;
  }
  .question{font-size:clamp(22px,5.8vw,44px);font-weight:700;margin-bottom:8px;color:var(--ink)}
  .objs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;max-width:820px}
  .obj{font-size:clamp(60px,16vw,120px);animation:pop .55s cubic-bezier(.3,1.6,.5,1) backwards,wiggle 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.18))}
  .obj.sm{font-size:clamp(42px,10.5vw,80px)}
  .hint{margin-top:12px;font-size:clamp(17px,4vw,26px);font-weight:600;color:#fff;background:var(--col);padding:7px 22px;border-radius:999px;animation:pulse 1.2s infinite;box-shadow:0 5px 0 rgba(0,0,0,.15)}
  .grad{background:linear-gradient(180deg,var(--col-light),var(--col));-webkit-background-clip:text;background-clip:text;color:transparent}
  .bignum{
    font-size:min(30vh,54vw);line-height:1;font-weight:700;
    filter:drop-shadow(0 6px 0 #fff) drop-shadow(0 14px 10px rgba(0,0,0,.18));animation:zoom .55s cubic-bezier(.3,1.6,.5,1);
  }
  .bignum.two{font-size:min(26vh,38vw)}
  .bignum.mid{font-size:min(22vh,40vw)}
  .arab{font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic","Scheherazade New",serif;font-size:min(28vh,48vw);line-height:1.5;font-weight:700;
    filter:drop-shadow(0 6px 0 #fff) drop-shadow(0 12px 8px rgba(0,0,0,.18));animation:zoom .55s cubic-bezier(.3,1.6,.5,1)}
  .arab.sm{font-size:min(19vh,34vw);line-height:1.4}
  .word{font-size:clamp(32px,9vw,64px);font-weight:700;color:var(--ink);line-height:1.1}
  .minis{font-size:clamp(22px,6vw,38px);margin-top:2px;letter-spacing:3px}
  .shape svg{width:min(52vw,30vh);height:min(52vw,30vh);animation:pop .55s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 12px 8px rgba(0,0,0,.2))}
  .shape.small svg{width:min(34vw,20vh);height:min(34vw,20vh)}
  .shapename{font-size:clamp(38px,11vw,88px);font-weight:700;line-height:1.05;filter:drop-shadow(0 4px 0 #fff);animation:zoom .55s cubic-bezier(.3,1.6,.5,1)}
  .example{font-size:clamp(18px,4.6vw,30px);font-weight:500;margin-top:4px;color:var(--ink)}
  .gfoot{width:100%;max-width:640px;background:rgba(255,255,255,.93);border-radius:24px;padding:6px 12px 8px;margin-top:6px;
    box-shadow:0 8px 20px rgba(120,80,200,.18),0 0 0 4px #fff,0 0 0 7px #e3d2ff;z-index:2}
  .gschool{font-size:clamp(18px,5vw,30px);font-weight:700;line-height:1.1;
    background:linear-gradient(90deg,#ff6fae,#ffa94d,#39d98a,#4da8ff,#a66bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .gsiswa{font-size:clamp(16px,4.3vw,24px);font-weight:700;color:var(--ink);line-height:1.2;word-break:break-word}
  .gteacher{font-size:clamp(13px,3.4vw,18px);font-weight:500;color:#7b6aa8;line-height:1.2}
  .gdate{display:inline-block;margin-top:3px;font-size:clamp(17px,4.6vw,26px);font-weight:700;color:#fff;padding:1px 20px;border-radius:999px;
    background:linear-gradient(135deg,#a66bff,#ff6fae);box-shadow:0 4px 0 rgba(0,0,0,.15)}

  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes pop{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
  @keyframes zoom{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes pulse{50%{transform:scale(1.07)}}
  @keyframes wiggle{0%,100%{rotate:-3deg}50%{rotate:3deg}}
  .confetti{position:fixed;top:-50px;animation:fall linear forwards;pointer-events:none;z-index:9}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="bg"></div>

<!-- HALAMAN AWAL: FORM DATA -->
<div id="home" class="screen active">
  <div class="card">
    <div class="bismillah">﷽</div>
    <div class="logo">🏫</div>
    <div><span class="ribbon">📝 Isi Data Dulu Ya</span></div>
    <form class="form" id="form" onsubmit="return begin(event)" autocomplete="off" novalidate>
      <div>
        <label for="fNama">Nama</label>
        <input id="fNama" type="text" maxlength="40" placeholder="Tulis nama kamu" enterkeyhint="next">
      </div>
      <div>
        <label for="fNim">NIM</label>
        <input id="fNim" type="text" maxlength="20" placeholder="Tulis NIM" enterkeyhint="next">
      </div>
      <div>
        <label for="fSekolah">Nama Sekolah</label>
        <input id="fSekolah" type="text" maxlength="60" placeholder="Tulis nama sekolah" enterkeyhint="done">
      </div>
      <div class="row2">
        <div>
          <label for="selBln">Bulan</label>
          <select id="selBln"></select>
        </div>
        <div>
          <label for="selThn">Tahun</label>
          <select id="selThn"></select>
        </div>
      </div>
      <div class="msg" id="formMsg"></div>
      <div style="text-align:center">
        <button class="btn green" type="submit" style="margin:0">▶ Mulai Belajar</button>
      </div>
    </form>
  </div>
</div>

<!-- MENU -->
<div id="menu" class="screen">
  <div class="wrap">
    <h1 id="menuTitle">Ayo Belajar! 🌈</h1>
    <div class="menu">
      <button class="btn blue" onclick="start('angka')"><span class="big">🔢</span>Belajar Angka<small>Angka 1 sampai 10</small></button>
      <button class="btn orange" onclick="start('bentuk')"><span class="big">🔷</span>Belajar Bentuk<small>Mengenal 10 bentuk</small></button>
      <button class="btn green" onclick="start('hijaiyah')"><span class="big">ب</span>Huruf Hijaiyah<small>28 huruf, 10 soal acak</small></button>
      <button class="btn pink" onclick="start('huruf')"><span class="big">🔤</span>Belajar Huruf<small>A sampai Z, 10 soal acak</small></button>
    </div>
    <button class="btn purple" style="font-size:19px;padding:9px 24px" onclick="show('home')">✏️ Ubah Data</button>
  </div>
</div>

<!-- PERMAINAN -->
<div id="game" class="screen">
  <div id="top">
    <button class="round" onclick="show('menu')" aria-label="Menu">🏠</button>
    <div class="dots" id="dots"></div>
    <button class="round" onclick="speakCurrent()" aria-label="Suara">🔊</button>
  </div>
  <div id="stage" onclick="next()"></div>
  <div class="gfoot">
    <div class="gschool" id="gSchool"></div>
    <div class="gsiswa" id="gSiswa"></div>
    <div class="gteacher" id="gTeacher"></div>
    <div class="gdate" id="gDate"></div>
  </div>
</div>

<!-- SELESAI -->
<div id="done" class="screen">
  <div class="card">
    <div class="logo">🏆</div>
    <h1 id="doneTitle">Hebat! Pintar! 🎉</h1>
    <div class="teacher" style="margin-bottom:10px">Kamu sudah selesai belajar</div>
    <div style="font-size:clamp(32px,9vw,56px);margin-bottom:8px">⭐⭐⭐⭐⭐</div>
    <div style="display:flex;flex-wrap:wrap;justify-content:center">
      <button class="btn green" onclick="start(mode)">🔁 Ulangi</button>
      <button class="btn purple" onclick="show('menu')">📋 Menu</button>
    </div>
  </div>
</div>

<script>
/* ===================== CONFIG ===================== */
const PENDIDIK = "Rodiya Mardiya, S.Pd";   // kosongkan "" kalau tidak ingin ditampilkan
const YEAR_FROM = 2024, YEAR_TO = 2026;    // pilihan tahun di dropdown
const ROUND = 10;                          // jumlah soal tiap permainan
/* ================================================== */

const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const $ = id => document.getElementById(id);

/* ---------- data diri (form) ---------- */
const fNama=$("fNama"), fNim=$("fNim"), fSekolah=$("fSekolah"),
      selBln=$("selBln"), selThn=$("selThn");
let user = {nama:"", nim:"", sekolah:""};

function lsGet(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

(function initForm(){
  BULAN.forEach((b,i)=>selBln.add(new Option(b,i)));
  for(let y=YEAR_FROM;y<=YEAR_TO;y++) selThn.add(new Option(y,y));
  let now=new Date(), y=now.getFullYear();
  if(y<YEAR_FROM) y=YEAR_FROM; if(y>YEAR_TO) y=YEAR_TO;
  selThn.value=y; selBln.value=now.getMonth();
  fNama.value=lsGet("tk_nama"); fNim.value=lsGet("tk_nim"); fSekolah.value=lsGet("tk_sekolah");
  [fNama,fNim,fSekolah].forEach(el=>el.addEventListener("input",()=>el.classList.remove("err")));
})();

function begin(e){
  if(e) e.preventDefault();
  const f={nama:fNama.value.trim(), nim:fNim.value.trim(), sekolah:fSekolah.value.trim()};
  let bad=false;
  [["nama",fNama],["nim",fNim],["sekolah",fSekolah]].forEach(([k,el])=>{
    const empty=!f[k]; el.classList.toggle("err",empty); if(empty) bad=true;
  });
  $("formMsg").textContent = bad ? "Isi nama, NIM, dan nama sekolah dulu ya 😊" : "";
  if(bad) return false;
  user=f;
  lsSet("tk_nama",f.nama); lsSet("tk_nim",f.nim); lsSet("tk_sekolah",f.sekolah);
  $("menuTitle").textContent = "Halo, " + f.nama + "! 🌈";
  if(document.activeElement) document.activeElement.blur();
  show("menu");
  return false;
}

/* ---------- warna ---------- */
const PAL = [
  {c:"#ff5d8f", l:"#ff9ac0", s:"#ffd0e2"},
  {c:"#ff9f1c", l:"#ffd166", s:"#ffe5b0"},
  {c:"#1fb6ff", l:"#7fd8ff", s:"#c4ecff"},
  {c:"#2ecc71", l:"#8cf0b6", s:"#c5f6d9"},
  {c:"#9b5de5", l:"#c9a4ff", s:"#e3d2ff"},
];

/* ---------- data soal ---------- */
const ANGKA = [
  {n:1,  emoji:"🍌", nama:"pisang",   kata:"Satu"},
  {n:2,  emoji:"🥭", nama:"mangga",   kata:"Dua"},
  {n:3,  emoji:"🍎", nama:"apel",     kata:"Tiga"},
  {n:4,  emoji:"🍊", nama:"jeruk",    kata:"Empat"},
  {n:5,  emoji:"🍓", nama:"stroberi", kata:"Lima"},
  {n:6,  emoji:"🍉", nama:"semangka", kata:"Enam"},
  {n:7,  emoji:"🍇", nama:"anggur",   kata:"Tujuh"},
  {n:8,  emoji:"🍍", nama:"nanas",    kata:"Delapan"},
  {n:9,  emoji:"🍐", nama:"pir",      kata:"Sembilan"},
  {n:10, emoji:"🍋", nama:"lemon",    kata:"Sepuluh"},
];

/* bentuk SVG dengan gradasi, kilau, dan garis tepi */
const BENTUK = [
  {nama:"Lingkaran", contoh:"Seperti roda dan bola ⚽",
   path:`<circle cx="100" cy="100" r="86" FILL STROKE/><ellipse cx="72" cy="62" rx="26" ry="14" fill="#fff" opacity=".45" transform="rotate(-30 72 62)"/>`},
  {nama:"Segitiga", contoh:"Seperti atap rumah 🏠",
   path:`<polygon points="100,16 186,178 14,178" FILL STROKE stroke-linejoin="round"/><polygon points="100,38 128,92 92,60" fill="#fff" opacity=".35"/>`},
  {nama:"Persegi", contoh:"Seperti jendela dan kotak 🪟",
   path:`<rect x="26" y="26" width="148" height="148" rx="14" FILL STROKE/><rect x="40" y="38" width="70" height="16" rx="8" fill="#fff" opacity=".4"/>`},
  {nama:"Persegi Panjang", contoh:"Seperti pintu dan buku 📕",
   path:`<rect x="12" y="52" width="176" height="96" rx="12" FILL STROKE/><rect x="26" y="62" width="80" height="14" rx="7" fill="#fff" opacity=".4"/>`},
  {nama:"Bintang", contoh:"Seperti bintang di langit ⭐",
   path:`<polygon points="100,12 124,72 188,77 139,118 155,182 100,147 45,182 61,118 12,77 76,72" FILL STROKE stroke-linejoin="round"/><polygon points="100,34 112,70 96,68" fill="#fff" opacity=".4"/>`},
  {nama:"Hati", contoh:"Seperti tanda sayang 💖",
   path:`<path d="M100 178 C22 122 10 62 55 40 C80 29 100 45 100 64 C100 45 120 29 145 40 C190 62 178 122 100 178 Z" FILL STROKE stroke-linejoin="round"/><ellipse cx="62" cy="62" rx="16" ry="9" fill="#fff" opacity=".45" transform="rotate(-35 62 62)"/>`},
  {nama:"Belah Ketupat", contoh:"Seperti layang-layang 🪁",
   path:`<polygon points="100,12 186,100 100,188 14,100" FILL STROKE stroke-linejoin="round"/><polygon points="100,34 56,98 100,84" fill="#fff" opacity=".35"/>`},
  {nama:"Oval", contoh:"Seperti telur 🥚",
   path:`<ellipse cx="100" cy="100" rx="90" ry="58" FILL STROKE/><ellipse cx="68" cy="78" rx="26" ry="11" fill="#fff" opacity=".45" transform="rotate(-20 68 78)"/>`},
  {nama:"Jajar Genjang", contoh:"Seperti kotak yang miring 📦",
   path:`<polygon points="58,46 190,46 142,154 10,154" FILL STROKE stroke-linejoin="round"/><polygon points="72,58 128,58 118,76 66,76" fill="#fff" opacity=".4"/>`},
  {nama:"Segi Enam", contoh:"Seperti sarang lebah 🐝",
   path:`<polygon points="100,12 176,56 176,144 100,188 24,144 24,56" FILL STROKE stroke-linejoin="round"/><polygon points="100,30 150,58 100,68 50,58" fill="#fff" opacity=".35"/>`},
];

function shapeSVG(i, pal, uid){
  const d = BENTUK[i].path
    .replace("FILL", `fill="url(#g${uid})"`)
    .replace("STROKE", `stroke="${pal.c}" stroke-width="6"`);
  return `<svg viewBox="0 0 200 200"><defs><linearGradient id="g${uid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${pal.l}"/><stop offset="1" stop-color="${pal.c}"/></linearGradient></defs>${d}</svg>`;
}

/* 28 huruf hijaiyah: [huruf, nama] */
const HIJAIYAH = [
  ["ا","Alif"],["ب","Ba"],["ت","Ta"],["ث","Tsa"],["ج","Jim"],["ح","Ha"],["خ","Kho"],
  ["د","Dal"],["ذ","Dzal"],["ر","Ro"],["ز","Zai"],["س","Sin"],["ش","Syin"],["ص","Shod"],
  ["ض","Dhod"],["ط","Tho"],["ظ","Zho"],["ع","Ain"],["غ","Ghoin"],["ف","Fa"],["ق","Qof"],
  ["ك","Kaf"],["ل","Lam"],["م","Mim"],["ن","Nun"],["و","Wau"],["ه","Ha"],["ي","Ya"],
];

/* huruf A-Z: [huruf, sebutan, kata, emoji] */
const HURUF = [
  ["A","A","Apel","🍎"],["B","Be","Bola","⚽"],["C","Ce","Cicak","🦎"],["D","De","Domba","🐑"],
  ["E","E","Es krim","🍦"],["F","Ef","Foto","📷"],["G","Ge","Gajah","🐘"],["H","Ha","Harimau","🐯"],
  ["I","I","Ikan","🐟"],["J","Je","Jeruk","🍊"],["K","Ka","Kucing","🐱"],["L","El","Lebah","🐝"],
  ["M","Em","Mangga","🥭"],["N","En","Nanas","🍍"],["O","O","Orang utan","🦧"],["P","Pe","Pisang","🍌"],
  ["Q","Ki","Quran","📖"],["R","Er","Rusa","🦌"],["S","Es","Semangka","🍉"],["T","Te","Topi","🎩"],
  ["U","U","Ular","🐍"],["V","Ve","Vas bunga","🏺"],["W","We","Wortel","🥕"],["X","Eks","Xilofon","🎹"],
  ["Y","Ye","Yoyo","🪀"],["Z","Zet","Zebra","🦓"],
];

const POOL = {angka:ANGKA, bentuk:BENTUK, hijaiyah:HIJAIYAH, huruf:HURUF};

let mode="angka", idx=0, stage=0, order=[];

/* acak soal; ambil ROUND soal, tidak boleh berurutan naik */
function pickOrder(m){
  const n=POOL[m].length, size=Math.min(ROUND,n);
  const asc = a => a.every((v,i)=>i===0||v>a[i-1]);
  let a;
  do{
    a=[...Array(n).keys()];
    for(let i=n-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    a=a.slice(0,size);
  }while(size>1 && asc(a));
  return a;
}

/* dekorasi latar */
(function(){
  const bg=$("bg");
  const items=["⭐","☁️","🌈","🎈","✨","🔺","🔵","🟨","🍎","🦋"];
  for(let i=0;i<16;i++){
    const e=document.createElement("div");
    e.className="float"; e.textContent=items[i%items.length];
    e.style.left=Math.random()*96+"vw";
    e.style.fontSize=(22+Math.random()*34)+"px";
    e.style.animationDuration=(18+Math.random()*22)+"s";
    e.style.animationDelay=(-Math.random()*30)+"s";
    bg.appendChild(e);
  }
})();

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
  try{speechSynthesis.cancel()}catch(e){}
}

function fillFooter(){
  $("gSchool").textContent = user.sekolah;
  $("gSiswa").textContent = "👤 " + user.nama + "  •  NIM " + user.nim;
  $("gTeacher").textContent = PENDIDIK ? "Pendidik: " + PENDIDIK : "";
  $("gDate").textContent = "📅 " + BULAN[+selBln.value] + " " + selThn.value;
}

function start(m){
  mode=m; idx=0; stage=0; order=pickOrder(m);
  fillFooter();
  $("doneTitle").textContent = "Hebat, " + user.nama + "! 🎉";
  show("game"); render();
}

function speak(t){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang="id-ID"; u.rate=.8; u.pitch=1.3;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakCurrent(){
  const d=POOL[mode][order[idx]];
  if(mode==="angka")    speak(stage===0 ? `Ada berapa buah ${d.nama}?` : d.kata);
  if(mode==="bentuk")   speak(stage===0 ? "Bentuk apa ini?" : d.nama);
  if(mode==="hijaiyah") speak(stage===0 ? "Huruf hijaiyah apa ini?" : d[1]);
  if(mode==="huruf")    speak(stage===0 ? "Huruf apa ini?" : `${d[1]}. ${d[1]} untuk ${d[2]}`);
}

function render(){
  const p=PAL[idx%5], total=order.length;
  const el=$("stage"), ix=order[idx], d=POOL[mode][ix];
  el.style.setProperty("--col",p.c);
  el.style.setProperty("--col-light",p.l);
  el.style.setProperty("--col-soft",p.s);
  $("dots").innerHTML = Array.from({length:total},(_,i)=>`<div class="dot ${i<=idx?"on":""}"></div>`).join("");

  if(mode==="angka"){
    if(stage===0){
      el.innerHTML=`<div class="panel"><div class="question">Ada berapa buah ${d.nama}?</div>
        <div class="objs">${Array.from({length:d.n},(_,i)=>`<span class="obj ${d.n>6?"sm":""}" style="animation-delay:${i*.12}s,${i*.2}s">${d.emoji}</span>`).join("")}</div>
        <div class="hint">👆 Ayo tebak! Sentuh layar</div></div>`;
    }else{
      el.innerHTML=`<div class="panel"><div class="bignum grad ${d.n>=10?"two":""}">${d.n}</div><div class="word">${d.kata}</div>
        <div class="minis">${d.emoji.repeat(d.n)}</div></div>`;
      confetti([d.emoji,"⭐","✨"]);
    }
  }else if(mode==="bentuk"){
    if(stage===0){
      el.innerHTML=`<div class="panel"><div class="question">Bentuk apa ini?</div>
        <div class="shape">${shapeSVG(ix,p,"a"+idx)}</div>
        <div class="hint">👆 Ayo tebak! Sentuh layar</div></div>`;
    }else{
      el.innerHTML=`<div class="panel"><div class="shape small">${shapeSVG(ix,p,"b"+idx)}</div>
        <div class="shapename grad">${d.nama}</div><div class="example">${d.contoh}</div></div>`;
      confetti(["⭐","✨","🎈"]);
    }
  }else if(mode==="hijaiyah"){
    if(stage===0){
      el.innerHTML=`<div class="panel"><div class="question">Huruf hijaiyah apa ini?</div>
        <div class="arab grad" dir="rtl">${d[0]}</div>
        <div class="hint">👆 Ayo tebak! Sentuh layar</div></div>`;
    }else{
      el.innerHTML=`<div class="panel"><div class="arab sm grad" dir="rtl">${d[0]}</div>
        <div class="shapename grad">${d[1]}</div></div>`;
      confetti(["⭐","✨","🌙"]);
    }
  }else{
    if(stage===0){
      el.innerHTML=`<div class="panel"><div class="question">Huruf apa ini?</div>
        <div class="bignum grad mid">${d[0]}${d[0].toLowerCase()}</div>
        <div class="hint">👆 Ayo tebak! Sentuh layar</div></div>`;
    }else{
      el.innerHTML=`<div class="panel"><div class="bignum grad mid">${d[0]}${d[0].toLowerCase()}</div>
        <div class="objs"><span class="obj">${d[3]}</span></div>
        <div class="word">${d[0]} untuk ${d[2]}</div></div>`;
      confetti([d[3],"⭐","✨"]);
    }
  }
  speakCurrent();
}

function next(){
  if(stage===0){ stage=1; render(); return; }
  idx++; stage=0;
  if(idx>=order.length){ show("done"); confetti(["🎉","⭐","🎈","✨"],26); return; }
  render();
}

function confetti(list,n=16){
  for(let i=0;i<n;i++){
    const s=document.createElement("div");
    s.className="confetti"; s.textContent=list[i%list.length];
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=(24+Math.random()*24)+"px";
    s.style.animationDuration=(2+Math.random()*2.2)+"s";
    s.style.animationDelay=(Math.random()*.6)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),5000);
  }
}
</script>
</body>
</html>
