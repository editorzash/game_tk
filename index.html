<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Belajar Angka & Bentuk - RA Miftahul Ulum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3b2a6b;
    --pink:#ff6fae; --pink-d:#d94a8a;
    --blue:#4da8ff; --blue-d:#2a7fd6;
    --green:#39d98a; --green-d:#1fae67;
    --orange:#ffa94d; --orange-d:#e8851f;
    --purple:#a66bff; --purple-d:#7b45d6;
    --yellow:#ffd93d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
  body{
    background:
      radial-gradient(circle at 15% 20%,#ffe3f1 0,transparent 40%),
      radial-gradient(circle at 85% 15%,#d9f0ff 0,transparent 40%),
      radial-gradient(circle at 80% 85%,#fff4c2 0,transparent 40%),
      radial-gradient(circle at 10% 90%,#dcfbe8 0,transparent 40%),
      linear-gradient(180deg,#fdf6ff,#eef7ff);
  }

  /* dekorasi mengambang */
  #bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .float{position:absolute;opacity:.55;animation:drift linear infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.08))}
  @keyframes drift{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}

  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;z-index:1}
  .screen.active{display:flex;animation:fadein .4s}
  @keyframes fadein{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

  /* kartu utama */
  .card{
    background:rgba(255,255,255,.86);backdrop-filter:blur(6px);
    border-radius:40px;padding:clamp(18px,4vw,36px) clamp(18px,5vw,48px);
    box-shadow:0 20px 50px rgba(120,80,200,.18),0 0 0 6px #fff,0 0 0 10px rgba(166,107,255,.18);
    max-width:min(94vw,720px);width:100%;
  }
  .bismillah{font-size:clamp(20px,4.5vw,30px);color:var(--purple-d);margin-bottom:4px}
  .logo{font-size:clamp(56px,14vw,100px);animation:bounce 2.2s ease-in-out infinite;display:inline-block}
  .school{
    font-size:clamp(30px,8.5vw,62px);font-weight:700;margin:4px 0 6px;line-height:1.05;
    background:linear-gradient(90deg,#ff6fae,#ffa94d,#39d98a,#4da8ff,#a66bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(2px 3px 0 rgba(255,255,255,.9));
  }
  .ribbon{
    display:inline-block;background:linear-gradient(135deg,#a66bff,#ff6fae);color:#fff;
    padding:6px 22px;border-radius:999px;font-size:clamp(14px,3.5vw,20px);font-weight:500;
    box-shadow:0 4px 0 rgba(0,0,0,.12);margin:6px 0;
  }
  .teacher{font-size:clamp(22px,5.5vw,38px);font-weight:600;margin:2px 0}
  .period{font-size:clamp(16px,4vw,24px);color:var(--orange-d);font-weight:600;margin:4px 0 10px}
  .datepick{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .datepick select{
    font:600 clamp(16px,4vw,22px) "Fredoka",sans-serif;color:var(--ink);
    padding:10px 14px;border-radius:18px;border:3px solid #d9c9ff;background:#fff;cursor:pointer;
    box-shadow:0 4px 0 #d9c9ff;outline:none;
  }
  .datepick select:focus{border-color:var(--purple)}
  .icons{font-size:clamp(30px,8vw,54px);letter-spacing:6px;margin:6px 0 12px}
  h1{font-size:clamp(30px,8vw,56px);margin:0 0 12px;color:var(--purple-d);text-shadow:3px 3px 0 #fff}

  /* tombol 3D */
  .btn{
    border:none;border-radius:999px;padding:14px 34px;font:600 clamp(20px,5vw,32px) "Fredoka",sans-serif;color:#fff;cursor:pointer;margin:8px;
    background:linear-gradient(180deg,var(--c1),var(--c2));
    box-shadow:0 8px 0 var(--c3),0 14px 18px rgba(0,0,0,.15),inset 0 3px 0 rgba(255,255,255,.4);
    text-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .08s,box-shadow .08s;
  }
  .btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--c3),0 4px 6px rgba(0,0,0,.15),inset 0 3px 0 rgba(255,255,255,.4)}
  .btn.green{--c1:#5cf0a8;--c2:var(--green);--c3:var(--green-d)}
  .btn.blue{--c1:#7cc1ff;--c2:var(--blue);--c3:var(--blue-d)}
  .btn.orange{--c1:#ffc67a;--c2:var(--orange);--c3:var(--orange-d)}
  .btn.pink{--c1:#ff9ac8;--c2:var(--pink);--c3:var(--pink-d)}
  .btn.purple{--c1:#c59aff;--c2:var(--purple);--c3:var(--purple-d)}
  .menu{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
  .menu .btn{padding:26px 36px;min-width:min(80vw,290px);display:flex;flex-direction:column;align-items:center;gap:2px}
  .menu .btn small{font-size:.55em;font-weight:400;opacity:.95}
  .menu .big{font-size:1.6em}

  /* layar permainan */
  #top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:3}
  .round{width:60px;height:60px;border-radius:50%;border:none;font-size:28px;cursor:pointer;background:#fff;
    box-shadow:0 5px 0 #d9c9ff,0 8px 14px rgba(0,0,0,.12)}
  .round:active{transform:translateY(4px);box-shadow:0 1px 0 #d9c9ff}
  .dots{display:flex;gap:10px;background:#fff;padding:10px 16px;border-radius:999px;box-shadow:0 4px 0 #d9c9ff}
  .dot{width:20px;height:20px;border-radius:50%;background:#ece4ff;transition:.3s}
  .dot.on{background:linear-gradient(135deg,#ffd93d,#ffa94d);transform:scale(1.15);box-shadow:0 0 8px #ffd93d}
  #stage{flex:1;width:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding-top:72px}
  .panel{
    background:rgba(255,255,255,.88);border-radius:44px;padding:clamp(14px,3vw,28px);
    box-shadow:0 18px 40px rgba(120,80,200,.2),0 0 0 6px #fff,0 0 0 10px var(--col-soft);
    display:flex;flex-direction:column;align-items:center;max-width:94vw;
  }
  .question{font-size:clamp(24px,6vw,46px);font-weight:700;margin-bottom:10px;color:var(--ink)}
  .objs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;max-width:820px}
  .obj{font-size:clamp(64px,17vw,130px);animation:pop .55s cubic-bezier(.3,1.6,.5,1) backwards,wiggle 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.18))}
  .hint{margin-top:14px;font-size:clamp(18px,4.2vw,28px);font-weight:600;color:#fff;background:var(--col);padding:8px 24px;border-radius:999px;animation:pulse 1.2s infinite;box-shadow:0 5px 0 rgba(0,0,0,.15)}
  .bignum{
    font-size:min(36vh,56vw);line-height:.95;font-weight:700;
    background:linear-gradient(180deg,var(--col-light),var(--col));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 0 #fff) drop-shadow(0 14px 10px rgba(0,0,0,.18));animation:zoom .55s cubic-bezier(.3,1.6,.5,1);
  }
  .word{font-size:clamp(34px,10vw,72px);font-weight:700;color:var(--ink)}
  .minis{font-size:clamp(26px,7vw,44px);margin-top:4px;letter-spacing:4px}
  .shape svg{width:min(54vw,32vh);height:min(54vw,32vh);animation:pop .55s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 12px 8px rgba(0,0,0,.2))}
  .shapename{font-size:clamp(42px,12vw,96px);font-weight:700;line-height:1.05;
    background:linear-gradient(180deg,var(--col-light),var(--col));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 #fff);animation:zoom .55s cubic-bezier(.3,1.6,.5,1)}
  .example{font-size:clamp(20px,5vw,34px);font-weight:500;margin-top:4px;color:var(--ink)}
  .gfoot{width:100%;max-width:760px;background:rgba(255,255,255,.92);border-radius:28px;padding:8px 14px 10px;margin-top:8px;
    box-shadow:0 8px 20px rgba(120,80,200,.18),0 0 0 4px #fff,0 0 0 7px #e3d2ff;z-index:2}
  .gschool{font-size:clamp(20px,5.5vw,34px);font-weight:700;line-height:1.1;
    background:linear-gradient(90deg,#ff6fae,#ffa94d,#39d98a,#4da8ff,#a66bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .gteacher{font-size:clamp(16px,4.3vw,26px);font-weight:600;color:var(--ink);line-height:1.15}
  .gdate{display:inline-block;margin-top:4px;font-size:clamp(20px,5.5vw,34px);font-weight:700;color:#fff;padding:2px 22px;border-radius:999px;
    background:linear-gradient(135deg,#a66bff,#ff6fae);box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .foot{position:absolute;bottom:10px;font-size:13px;color:#7b6aa8;z-index:2}

  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes pop{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
  @keyframes zoom{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes pulse{50%{transform:scale(1.07)}}
  @keyframes wiggle{0%,100%{rotate:-3deg}50%{rotate:3deg}}
  .confetti{position:fixed;top:-50px;animation:fall linear forwards;pointer-events:none;z-index:9}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="bg"></div>

<!-- HALAMAN AWAL -->
<div id="home" class="screen active">
  <div class="card">
    <div class="bismillah">﷽</div>
    <div class="logo">🏫</div>
    <div class="school" id="schoolName"></div>
    <div class="ribbon">Pendidik</div>
    <div class="teacher" id="teacherName"></div>
    <div class="period">📅 Bulan &amp; Tahun Belajar</div>
    <div class="datepick">
      <select id="selBln" aria-label="Bulan"></select>
      <select id="selThn" aria-label="Tahun"></select>
    </div>
    <div class="icons">🍎 🔺 🔢 ⭐</div>
    <button class="btn green" onclick="show('menu')">▶ Mulai Belajar</button>
  </div>
</div>

<!-- MENU -->
<div id="menu" class="screen">
  <h1>Ayo Belajar! 🌈</h1>
  <div class="menu">
    <button class="btn blue" onclick="start('angka')"><span class="big">🔢</span>Belajar Angka<small>Angka 1 sampai 5</small></button>
    <button class="btn orange" onclick="start('bentuk')"><span class="big">🔷</span>Belajar Bentuk<small>Mengenal 5 bentuk</small></button>
  </div>
  <button class="btn pink" style="font-size:20px;padding:10px 26px" onclick="show('home')">🏠 Halaman Awal</button>
</div>

<!-- PERMAINAN -->
<div id="game" class="screen">
  <div id="top">
    <button class="round" onclick="show('menu')" aria-label="Menu">🏠</button>
    <div class="dots" id="dots"></div>
    <button class="round" onclick="speakCurrent()" aria-label="Suara">🔊</button>
  </div>
  <div id="stage" onclick="next()"></div>
  <div class="gfoot">
    <div class="gschool" id="gSchool"></div>
    <div class="gteacher" id="gTeacher"></div>
    <div class="gdate" id="gDate"></div>
  </div>
</div>

<!-- SELESAI -->
<div id="done" class="screen">
  <div class="card">
    <div class="logo">🏆</div>
    <h1>Hebat! Pintar! 🎉</h1>
    <div class="teacher" style="margin-bottom:10px">Kamu sudah selesai belajar</div>
    <div style="font-size:clamp(34px,9vw,60px);margin-bottom:8px">⭐⭐⭐⭐⭐</div>
    <div style="display:flex;flex-wrap:wrap;justify-content:center">
      <button class="btn green" onclick="start(mode)">🔁 Ulangi</button>
      <button class="btn purple" onclick="show('menu')">📋 Menu</button>
    </div>
  </div>
</div>

<script>
/* ===================== CONFIG ===================== */
const SCHOOL  = "RA Miftahul Ulum";
const TEACHER = "Rodiya Mardiya, S.Pd";
const YEAR_FROM = 2024, YEAR_TO = 2026;   // pilihan tahun di dropdown
/* ================================================== */

const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

/* dropdown tanggal / bulan / tahun */
const selBln=document.getElementById("selBln"),
      selThn=document.getElementById("selThn");

(function initDate(){
  BULAN.forEach((b,i)=>selBln.add(new Option(b,i)));
  for(let y=YEAR_FROM;y<=YEAR_TO;y++) selThn.add(new Option(y,y));
  let now=new Date(), y=now.getFullYear();
  if(y<YEAR_FROM) y=YEAR_FROM; if(y>YEAR_TO) y=YEAR_TO;
  selThn.value=y; selBln.value=now.getMonth();
})();

/* warna utama, versi terang, dan versi lembut untuk setiap halaman (1-5) */
const PAL = [
  {c:"#ff5d8f", l:"#ff9ac0", s:"#ffd0e2"},
  {c:"#ff9f1c", l:"#ffd166", s:"#ffe5b0"},
  {c:"#1fb6ff", l:"#7fd8ff", s:"#c4ecff"},
  {c:"#2ecc71", l:"#8cf0b6", s:"#c5f6d9"},
  {c:"#9b5de5", l:"#c9a4ff", s:"#e3d2ff"},
];

const ANGKA = [
  {n:1, emoji:"🍌", nama:"pisang",   kata:"Satu"},
  {n:2, emoji:"🥭", nama:"mangga",   kata:"Dua"},
  {n:3, emoji:"🍎", nama:"apel",     kata:"Tiga"},
  {n:4, emoji:"🍊", nama:"jeruk",    kata:"Empat"},
  {n:5, emoji:"🍓", nama:"stroberi", kata:"Lima"},
];

/* bentuk SVG dengan gradasi, kilau, dan garis tepi */
const BENTUK = [
  {nama:"Lingkaran", contoh:"Seperti roda dan bola ⚽",
   path:`<circle cx="100" cy="100" r="86" FILL STROKE/><ellipse cx="72" cy="62" rx="26" ry="14" fill="#fff" opacity=".45" transform="rotate(-30 72 62)"/>`},
  {nama:"Segitiga", contoh:"Seperti atap rumah 🏠",
   path:`<polygon points="100,16 186,178 14,178" FILL STROKE stroke-linejoin="round"/><polygon points="100,38 128,92 92,60" fill="#fff" opacity=".35"/>`},
  {nama:"Persegi", contoh:"Seperti jendela dan kotak 🪟",
   path:`<rect x="26" y="26" width="148" height="148" rx="14" FILL STROKE/><rect x="40" y="38" width="70" height="16" rx="8" fill="#fff" opacity=".4"/>`},
  {nama:"Persegi Panjang", contoh:"Seperti pintu dan buku 📕",
   path:`<rect x="12" y="52" width="176" height="96" rx="12" FILL STROKE/><rect x="26" y="62" width="80" height="14" rx="7" fill="#fff" opacity=".4"/>`},
  {nama:"Bintang", contoh:"Seperti bintang di langit ⭐",
   path:`<polygon points="100,12 124,72 188,77 139,118 155,182 100,147 45,182 61,118 12,77 76,72" FILL STROKE stroke-linejoin="round"/><polygon points="100,34 112,70 96,68" fill="#fff" opacity=".4"/>`},
];

function shapeSVG(i, pal, uid){
  const d = BENTUK[i].path
    .replace("FILL", `fill="url(#g${uid})"`)
    .replace("STROKE", `stroke="${pal.c}" stroke-width="6"`);
  return `<svg viewBox="0 0 200 200"><defs><linearGradient id="g${uid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${pal.l}"/><stop offset="1" stop-color="${pal.c}"/></linearGradient></defs>${d}</svg>`;
}

let mode="angka", idx=0, stage=0, order=[0,1,2,3,4];

/* acak urutan 5 soal (dijamin tidak berurutan 1-2-3-4-5) */
function shuffle(){
  const a=[0,1,2,3,4];
  do{
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
  }while(a.every((v,i)=>v===i));
  return a;
}

document.getElementById("schoolName").textContent = SCHOOL;
document.getElementById("teacherName").textContent = TEACHER;

/* dekorasi latar */
(function(){
  const bg=document.getElementById("bg");
  const items=["⭐","☁️","🌈","🎈","✨","🔺","🔵","🟨","🍎","🦋"];
  for(let i=0;i<16;i++){
    const e=document.createElement("div");
    e.className="float"; e.textContent=items[i%items.length];
    e.style.left=Math.random()*96+"vw";
    e.style.fontSize=(22+Math.random()*34)+"px";
    e.style.animationDuration=(18+Math.random()*22)+"s";
    e.style.animationDelay=(-Math.random()*30)+"s";
    bg.appendChild(e);
  }
})();

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  try{speechSynthesis.cancel()}catch(e){}
}
function start(m){
  mode=m; idx=0; stage=0; order=shuffle();
  document.getElementById("gSchool").textContent = SCHOOL;
  document.getElementById("gTeacher").textContent = "Pendidik: " + TEACHER;
  document.getElementById("gDate").textContent =
    "📅 " + BULAN[+selBln.value] + " " + selThn.value;
  show("game"); render();
}

function speak(t){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang="id-ID"; u.rate=.8; u.pitch=1.3;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakCurrent(){
  if(mode==="angka"){
    const d=ANGKA[order[idx]];
    speak(stage===0 ? `Ada berapa buah ${d.nama}?` : d.kata);
  }else{
    const d=BENTUK[order[idx]];
    speak(stage===0 ? "Bentuk apa ini?" : d.nama);
  }
}

function render(){
  const p=PAL[idx%5];
  const el=document.getElementById("stage");
  el.style.setProperty("--col",p.c);
  el.style.setProperty("--col-light",p.l);
  el.style.setProperty("--col-soft",p.s);
  document.getElementById("dots").innerHTML =
    PAL.map((_,i)=>`<div class="dot ${i<=idx?"on":""}"></div>`).join("");

  if(mode==="angka"){
    const d=ANGKA[order[idx]];
    if(stage===0){
      el.innerHTML=`<div class="panel"><div class="question">Ada berapa buah ${d.nama}?</div>
        <div class="objs">${Array.from({length:d.n},(_,i)=>`<span class="obj" style="animation-delay:${i*.15}s,${i*.2}s">${d.emoji}</span>`).join("")}</div>
        <div class="hint">👆 Ayo tebak! Sentuh layar</div></div>`;
    }else{
      el.innerHTML=`<div class="panel"><div class="bignum">${d.n}</div><div class="word">${d.kata}</div>
        <div class="minis">${d.emoji.repeat(d.n)}</div></div>`;
      confetti([d.emoji,"⭐","✨"]);
    }
  }else{
    const d=BENTUK[order[idx]];
    if(stage===0){
      el.innerHTML=`<div class="panel"><div class="question">Bentuk apa ini?</div>
        <div class="shape">${shapeSVG(order[idx],p,"a"+idx)}</div>
        <div class="hint">👆 Ayo tebak! Sentuh layar</div></div>`;
    }else{
      el.innerHTML=`<div class="panel"><div class="shape">${shapeSVG(order[idx],p,"b"+idx).replace("<svg ",'<svg style="width:min(36vw,22vh);height:min(36vw,22vh)" ')}</div>
        <div class="shapename">${d.nama}</div><div class="example">${d.contoh}</div></div>`;
      confetti(["⭐","✨","🎈"]);
    }
  }
  speakCurrent();
}

function next(){
  if(stage===0){ stage=1; render(); return; }
  idx++; stage=0;
  if(idx>=5){ show("done"); confetti(["🎉","⭐","🎈","✨"],26); return; }
  render();
}

function confetti(list,n=16){
  for(let i=0;i<n;i++){
    const s=document.createElement("div");
    s.className="confetti"; s.textContent=list[i%list.length];
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=(24+Math.random()*24)+"px";
    s.style.animationDuration=(2+Math.random()*2.2)+"s";
    s.style.animationDelay=(Math.random()*.6)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),5000);
  }
}
</script>
</body>
</html>
